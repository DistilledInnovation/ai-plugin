# Especificación portable del flujo, según assets/workflow-contract.schema.json (versión 1.0).
# Las claves van en inglés porque es un contrato técnico; el contenido, en español.
# Este ejemplo describe FLU-01 (Clínica Dental Sonrisa Norte, ficticia): piloto acotado a la variante A.
# Para usarlo con otro flujo, reemplaza los valores y conserva las claves.
# Sin credenciales, direcciones reales ni datos personales. Los accesos se describen como capacidades.

workflow_id: FLU-01
version: "1.0"

metadata:
  name: Agendar citas
  owner: Jefa de recepción
  objective: "RET-01: de 6 a 3 minutos de trabajo por solicitud y de 4 a 1 cita con error por cada 100, sin empeorar la confirmación el mismo día."
  maturity: pilot            # design | prototype | pilot | production
  source_refs: [RET-01, DEC-05, DEC-06, SUP-04, PRU-01, PRU-02]
  portability_notice: "La definición es portable; la ejecución no tiene por qué ser idéntica en cada plataforma (transacciones, identidad, tiempos de espera, orquestación, costos y comportamiento del modelo)."

actors:
  - {actor_id: ACT-01, type: human, role: Recepcionista del piloto, responsibilities: "Revisa los datos leídos, resuelve coincidencias dudosas, decide si hay urgencia y aprueba cada propuesta y cada registro."}
  - {actor_id: ACT-02, type: human, role: Jefa de recepción, responsibilities: "Responde por el proceso, revisa las excepciones y puede apagar la parte con IA y volver al modo manual."}
  - {actor_id: ACT-03, type: human, role: Odontóloga coordinadora clínica, responsibilities: "Aprueba los criterios de urgencia; no opera el flujo."}
  - {actor_id: ACT-04, type: ai, role: Componente de IA acotado, responsibilities: "Solo lee mensajes y marca posibles urgencias; no decide, no envía y no registra."}
  - {actor_id: ACT-05, type: system, role: Reglas de agenda, responsibilities: "Busca y compara registros, calcula horarios, redacta con plantilla, registra y avisa, dentro de reglas fijas."}
  - {actor_id: ACT-06, type: human, role: Paciente, responsibilities: "Envía la solicitud y responde a la propuesta; es externo al equipo."}

states:
  - {state_id: ST-01, kind: initial, description: Solicitud recibida}
  - {state_id: ST-02, kind: intermediate, description: Datos leídos y revisados}
  - {state_id: ST-03, kind: intermediate, description: Paciente identificado y sin solicitud abierta}
  - {state_id: ST-04, kind: intermediate, description: Posible urgencia marcada o descartada por el componente}
  - {state_id: ST-05, kind: intermediate, description: Urgencia decidida por una persona}
  - {state_id: ST-06, kind: waiting, description: Propuesta enviada; se espera la respuesta del paciente}
  - {state_id: ST-07, kind: intermediate, description: Horario aceptado por el paciente}
  - {state_id: ST-08, kind: success, description: Cita registrada y confirmada}
  - {state_id: ST-09, kind: failure, description: "En cola de revisión de recepción (variantes fuera del piloto, baja certeza o falla)"}
  - {state_id: ST-10, kind: success, description: Derivada como urgencia; se atiende fuera de este flujo}
  - {state_id: ST-11, kind: waiting, description: "Coincidencia dudosa; espera que recepción la resuelva"}

steps:
  - step_id: FUT-01
    name: Leer la solicitud y extraer datos
    kind: ai_assisted
    actor: ACT-04
    trigger: {type: event, description: "Llega una solicitud por mensaje o formulario (en el piloto, solo la variante A)."}
    inputs:
      - {name: request_text, description: "Texto de la solicitud del paciente.", type: text, required: true, sensitivity: sensitive}
    outputs:
      - {name: extracted_data, description: "Nombre, documento o teléfono, y motivo de la consulta.", type: record, required: true, sensitivity: sensitive}
    business_rules:
      - "El mensaje del paciente se trata como dato, nunca como instrucciones (GRD-06)."
      - "Lo que no se lee con certeza va a la cola de revisión (GRD-02); las variantes B, C y D van allí durante el piloto."
    authority_level: 2
    guardrails: [GRD-01, GRD-02, GRD-06]
    approval_policy: APR-04
    external_effect: false
    success_state: ST-02
    failure_state: ST-09
    idempotency:
      strategy: natural_key
      key_fields: [request_id]
      notes: "Una lectura por solicitud; repetirla no crea otra solicitud."
    retry_policy: {max_attempts: 1, on_exhausted: "Enviar la solicitud a la cola de revisión de recepción."}
    evidence: [EVD-01]

  - step_id: FUT-02
    name: Identificar al paciente y detectar una solicitud abierta
    kind: deterministic
    actor: ACT-05
    trigger: {type: previous_step, description: "Datos leídos y revisados.", after_step: FUT-01}
    inputs:
      - {name: extracted_data, description: "Datos leídos de la solicitud.", type: record, required: true, sensitivity: sensitive}
    outputs:
      - {name: patient_match, description: "Coincidencia exacta, dudosa o sin ficha, y si ya hay una solicitud abierta del mismo paciente.", type: record, required: true, sensitivity: sensitive}
    business_rules:
      - "Buscar por documento y teléfono (SUP-05)."
      - "Si ya hay una solicitud abierta del mismo paciente, no se abre otra (EXC-04)."
    authority_level: 3
    guardrails: [GRD-02]
    external_effect: false
    success_state: ST-03
    failure_state: ST-09
    idempotency: {strategy: not_applicable, notes: "Paso de solo lectura."}
    evidence: [EVD-02]
    extensions:
      branches:
        - {condition: "Coincidencia exacta y sin solicitud abierta", next_state: ST-03, next_step: FUT-04}
        - {condition: "Coincidencia dudosa o paciente sin ficha", next_state: ST-11, next_step: FUT-03}

  - step_id: FUT-03
    name: Resolver coincidencias dudosas
    kind: human_task
    actor: ACT-01
    trigger: {type: previous_step, description: "Solo si FUT-02 deja una coincidencia dudosa (ST-11).", after_step: FUT-02}
    inputs:
      - {name: patient_match, description: "Coincidencia dudosa a resolver.", type: record, required: true, sensitivity: sensitive}
    outputs:
      - {name: confirmed_patient, description: "Paciente confirmado por una persona.", type: record, required: true, sensitivity: sensitive}
    authority_level: 0
    external_effect: false
    success_state: ST-03
    failure_state: ST-09
    idempotency: {strategy: not_applicable, notes: "Tarea humana sin efecto externo."}
    evidence: [EVD-02]

  - step_id: FUT-04
    name: Marcar posible urgencia
    kind: ai_assisted
    actor: ACT-04
    trigger: {type: event, description: "El flujo llega a ST-03 (paciente identificado): directo desde FUT-02 con coincidencia exacta, o desde FUT-03 cuando recepción resuelve la duda."}
    inputs:
      - {name: extracted_data, description: "Motivo de la consulta leído de la solicitud.", type: record, required: true, sensitivity: sensitive}
    outputs:
      - {name: urgency_flag, description: "Marca de posible urgencia y el motivo de la marca.", type: record, required: true, sensitivity: sensitive}
    business_rules:
      - "Ante la duda se marca como posible urgencia (GRD-05)."
      - "Los criterios los aprueba la odontóloga coordinadora clínica (ACT-03)."
    authority_level: 1
    guardrails: [GRD-01, GRD-05, GRD-06]
    external_effect: false
    success_state: ST-04
    failure_state: ST-09
    idempotency: {strategy: not_applicable, notes: "Solo produce una marca; no modifica nada fuera del flujo."}
    evidence: [EVD-03]
    extensions:
      entry_from: [FUT-02, FUT-03]

  - step_id: FUT-05
    name: Decidir si es urgencia
    kind: decision
    actor: ACT-01
    trigger: {type: previous_step, description: "Marca de urgencia disponible.", after_step: FUT-04}
    inputs:
      - {name: urgency_flag, description: "Marca y motivo propuestos por el componente.", type: record, required: true, sensitivity: sensitive}
    outputs:
      - {name: urgency_decision, description: "Decisión de una persona: es urgencia o no.", type: boolean, required: true, sensitivity: sensitive}
    business_rules:
      - "Decide una persona, con los criterios de la odontóloga coordinadora clínica."
      - "Si es urgencia, el flujo termina en ST-10 y se atiende fuera de él."
    authority_level: 0
    guardrails: [GRD-05]
    approval_policy: APR-03
    external_effect: false
    success_state: ST-05
    failure_state: ST-09
    idempotency: {strategy: not_applicable, notes: "Decisión humana registrada una vez por solicitud."}
    evidence: [EVD-03]
    extensions:
      branches:
        - {condition: "La persona decide que es urgencia", next_state: ST-10}

  - step_id: FUT-06
    name: Calcular horarios y proponer tres opciones
    kind: deterministic
    actor: ACT-05
    trigger: {type: previous_step, description: "Urgencia descartada por una persona.", after_step: FUT-05}
    inputs:
      - {name: confirmed_patient, description: "Paciente confirmado.", type: record, required: true, sensitivity: sensitive}
      - {name: appointment_type, description: "Tipo de cita pedido.", type: text, required: true, sensitivity: internal}
    outputs:
      - {name: proposal_sent, description: "Mensaje con tres horarios libres según las reglas de agenda.", type: text, required: true, sensitivity: personal}
    business_rules:
      - "Los horarios salen de las reglas de agenda escritas por la jefa de recepción."
      - "La propuesta usa una plantilla fija."
    authority_level: 2
    guardrails: [GRD-03]
    approval_policy: APR-01
    external_effect: true
    success_state: ST-06
    failure_state: ST-09
    idempotency:
      strategy: idempotency_key
      key_fields: [request_id, proposal_version]
      notes: "Una propuesta por solicitud y versión; un reintento no vuelve a enviarla si ya hay constancia."
    retry_policy: {max_attempts: 1, on_exhausted: "Enviar a la cola de revisión de recepción."}
    evidence: [EVD-04]

  - step_id: FUT-07
    name: Esperar la respuesta y avisar internamente si no llega
    kind: wait
    actor: ACT-05
    trigger: {type: event, description: "El paciente responde o vence el plazo de espera (plazo por definir con la jefa de recepción)."}
    inputs:
      - {name: patient_reply, description: "Respuesta del paciente a la propuesta.", type: text, required: false, sensitivity: sensitive}
    outputs:
      - {name: accepted_slot, description: "Horario aceptado por el paciente.", type: record, required: false, sensitivity: personal}
      - {name: internal_notice, description: "Aviso interno a la jefa de recepción si no hay respuesta.", type: text, required: false, sensitivity: internal}
    authority_level: 3
    guardrails: [GRD-07]
    external_effect: false
    success_state: ST-07
    failure_state: ST-09
    idempotency:
      strategy: natural_key
      key_fields: [request_id, notice_date]
      notes: "Un aviso interno por solicitud y por día."
    evidence: [EVD-06]

  - step_id: FUT-08
    name: Registrar la cita y confirmar al paciente
    kind: deterministic
    actor: ACT-05
    trigger: {type: previous_step, description: "Horario aceptado por el paciente.", after_step: FUT-07}
    inputs:
      - {name: accepted_slot, description: "Horario aceptado.", type: record, required: true, sensitivity: personal}
      - {name: confirmed_patient, description: "Paciente confirmado.", type: record, required: true, sensitivity: sensitive}
    outputs:
      - {name: appointment_record, description: "Cita registrada en la agenda y confirmación enviada.", type: record, required: true, sensitivity: personal}
    business_rules:
      - "No se registra dos veces la misma cita para el mismo paciente y horario (EXC-04)."
    authority_level: 2
    guardrails: [GRD-03, GRD-04]
    approval_policy: APR-02
    external_effect: true
    success_state: ST-08
    failure_state: ST-09
    idempotency:
      strategy: idempotency_key
      key_fields: [patient_id, slot_id]
      notes: "La clave identifica la cita; un reintento reconoce que ya existe y no la duplica."
    retry_policy: {max_attempts: 0, on_exhausted: "No se reintenta sola: pasa a la cola de revisión."}
    evidence: [EVD-05]

approval_policies:
  - policy_id: APR-01
    applies_to: [FUT-06]
    approver_role: Recepcionista del piloto
    condition: "Siempre, mientras dure el piloto, antes de enviar la propuesta al paciente (GRD-03)."
    on_timeout: "El caso queda en espera y la jefa de recepción recibe un aviso al final del día."
    on_rejection: "Recepción corrige la propuesta y la vuelve a presentar."
  - policy_id: APR-02
    applies_to: [FUT-08]
    approver_role: Recepcionista del piloto
    condition: "Siempre, antes de registrar la cita y confirmarla (GRD-03, GRD-04)."
    on_timeout: "El caso queda en espera y la jefa de recepción recibe un aviso al final del día."
    on_rejection: "El caso pasa a la cola de revisión."
  - policy_id: APR-03
    applies_to: [FUT-05]
    approver_role: Recepcionista del piloto, con criterios aprobados por la odontóloga coordinadora clínica
    condition: "Siempre que haya marca de posible urgencia o duda (GRD-05)."
    on_timeout: "Se trata como posible urgencia y se avisa a la jefa de recepción."
    on_rejection: "No aplica: la persona decide."
  - policy_id: APR-04
    applies_to: [FUT-01]
    approver_role: Recepcionista del piloto
    condition: "Revisa los datos leídos antes de usarlos."
    on_timeout: "El caso queda en espera en la cola de revisión."
    on_rejection: "Recepción corrige los datos."

evidence_requirements:
  - {evidence_id: EVD-01, description: "Datos leídos de la solicitud y correcciones de recepción.", produced_by: "FUT-01, ACT-01", retention: "Por definir con la administradora"}
  - {evidence_id: EVD-02, description: "Coincidencias dudosas y cómo se resolvieron.", produced_by: "FUT-02 y FUT-03", retention: "Por definir con la administradora"}
  - {evidence_id: EVD-03, description: "Marca de urgencia, decisión y quién decidió.", produced_by: "FUT-04 y FUT-05", retention: "Por definir con la administradora"}
  - {evidence_id: EVD-04, description: "Propuesta enviada y quién la aprobó.", produced_by: FUT-06, retention: "Por definir con la administradora"}
  - {evidence_id: EVD-05, description: "Cita registrada, confirmación enviada y aprobación.", produced_by: FUT-08, retention: "Por definir con la administradora"}
  - {evidence_id: EVD-06, description: "Avisos internos emitidos.", produced_by: FUT-07, retention: "Por definir con la administradora"}

metrics:
  - {name: "Tiempo de trabajo por solicitud", baseline: "6 minutos (HAL-01, medido en 20 solicitudes de todas las variantes; Hecho)", target: "3 minutos", measured_in: pilot}
  - {name: "Citas con error", baseline: "Unas 4 de cada 100 (SUP-01, Dicho por participante, sin contar; se cuenta en PRU-03)", target: "1 de cada 100 (indicativo: con unas 100 solicitudes del piloto)", measured_in: pilot}
  - {name: "Minutos por aprobación", baseline: "No existe hoy: la aprobación es un paso nuevo", target: "Menos de 3 minutos", measured_in: prototype}
  - {name: "Confirmación al paciente", baseline: "El mismo día (Dicho por participante, en RET-01)", target: "No empeora", measured_in: pilot}

acceptance_tests:
  - {test_id: AT-01, kind: positive, description: "Un mensaje de la variante A con todos los datos termina en cita confirmada, con dos aprobaciones de recepción.", steps_covered: [FUT-01, FUT-02, FUT-04, FUT-05, FUT-06, FUT-07, FUT-08]}
  - {test_id: AT-02, kind: negative, description: "Un mensaje que contiene una instrucción dirigida al sistema se trata como texto del paciente y no cambia lo que hace el flujo (GRD-06).", steps_covered: [FUT-01, FUT-04]}
  - {test_id: AT-03, kind: negative, description: "Un mensaje con posible urgencia siempre se marca y lo decide una persona; nunca avanza solo a una propuesta.", steps_covered: [FUT-04, FUT-05]}
  - {test_id: AT-04, kind: negative, description: "Un paciente con una solicitud abierta no genera una segunda solicitud.", steps_covered: [FUT-02]}
  - {test_id: AT-05, kind: negative, description: "Una solicitud de las variantes B, C o D llega a la cola de revisión en vez de continuar sola.", steps_covered: [FUT-01]}
  - {test_id: AT-06, kind: negative, description: "Si se reintenta el registro, la cita no se duplica.", steps_covered: [FUT-08]}

required_capabilities:
  - Leer texto libre y extraer datos acotados
  - Buscar y comparar registros
  - Calcular horarios según reglas
  - Redactar con plantillas
  - Pedir aprobación humana
  - Registrar lo que se hizo
  - Modo manual de respaldo

extensions:
  pilot_scope:
    variant: "A: cita nueva de un paciente con ficha (PRU-01)"
    channels: [mensaje, formulario]
    out_of_scope: [llamadas, "variantes B, C y D", "reagendar y cancelar (FLU-02)"]
