name: Validar

on:
  push:
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    env:
      TERMINOS_PROHIBIDOS: ${{ secrets.TERMINOS_PROHIBIDOS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pruebas
        run: python -m unittest discover -s tests -v
      - name: Verificar bloques compartidos
        run: python scripts/sincronizar_bloques.py --verificar
      - name: Validar skills y plugins
        run: python scripts/validar.py
